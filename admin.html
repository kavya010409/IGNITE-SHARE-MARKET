<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNITE PRO | Admin Volatility & News Overlay Control</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        darkBg: '#0b0e14',
                        darkCard: '#151922',
                        darkBorder: '#232936',
                        accentGreen: '#00c853',
                        accentRed: '#ff3d00',
                        accentBlue: '#2962ff'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-accentBlue selection:text-white">

    <!-- TOP NAVBAR -->
    <header class="bg-darkCard border-b border-darkBorder px-6 py-4 sticky top-0 z-50 flex items-center justify-between shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-wider text-white uppercase flex items-center gap-2">
                    IGNITE ADMIN <span class="text-xs font-semibold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">OVERLAY ENGINE</span>
                </h1>
                <p class="text-xs text-gray-400 font-medium">Market Volatility & Sentiment Injection Panel</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <a href="index.html" class="px-4 py-2 rounded-xl bg-darkBg border border-darkBorder text-xs font-semibold text-gray-300 hover:text-white hover:border-accentBlue transition-all flex items-center gap-2">
                <svg class="w-4 h-4 text-accentBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Trading Floor
            </a>
        </div>
    </header>

    <!-- MAIN ADMIN CONTENT GRID -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT COLUMN: NEWS INJECTION DISPATCH ENGINE (7 COLS) -->
        <section class="lg:col-span-7 bg-darkCard border border-darkBorder rounded-3xl p-6 shadow-2xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-darkBorder mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <span>Dispatch Market Event</span>
                        </h2>
                        <p class="text-xs text-gray-400 mt-1">Injects volatility multipliers into the continuous market simulator</p>
                    </div>
                    <span class="text-xs font-mono bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-full font-bold">Admin Privileges Active</span>
                </div>

                <form id="admin-news-form" onsubmit="dispatchNewsEvent(event)" class="space-y-5">
                    
                    <!-- 1. Target Stock Selector -->
                    <div>
                        <label class="text-xs font-semibold text-gray-400 block mb-2">Target Stock / Market Segment</label>
                        <select id="target-stock-select" class="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-accentBlue transition-colors font-mono">
                            <option value="GLOBAL" selected>🌐 GLOBAL MARKET (Impact All 30 Stocks)</option>
                            <option value="APEX">APEX - Apex Dynamics Corp</option>
                            <option value="CRPT">CRPT - Cryptonix Global Systems</option>
                            <option value="METV">METV - Metaverse Vision Ltd</option>
                            <option value="ROBO">ROBO - Robotech Automations</option>
                            <option value="NVRA">NVRA - Nova Era Technologies</option>
                            <option value="HYDR">HYDR - HydroClean Energy</option>
                            <option value="VRTX">VRTX - Vortex Aerospace</option>
                            <option value="QNTM">QNTM - Quantum Computing Labs</option>
                            <option value="PLSM">PLSM - Plasma Medical Devices</option>
                            <option value="ORBT">ORBT - Orbital Satellite Networks</option>
                            <option value="STRM">STRM - StreamFlow Cloud Services</option>
                            <option value="AERO">AERO - Aerovault Logistics</option>
                            <option value="SOLR">SOLR - Solaria Power Group</option>
                            <option value="CELL">CELL - CelluGen BioLabs</option>
                            <option value="DATA">DATA - DataSphere Analytics</option>
                            <option value="CYBR">CYBR - CyberFort Defense Systems</option>
                            <option value="GENM">GENM - Genomix Research Inc</option>
                            <option value="PHOX">PHOX - Phox Photonics Corp</option>
                            <option value="NANO">NANO - NanoScale Innovations</option>
                            <option value="AURA">AURA - Aura Spatial Tech</option>
                            <option value="TITN">TITN - Titan Heavy Machinery</option>
                            <option value="SYNX">SYNX - Synapse Neural Networks</option>
                            <option value="ZEUS">ZEUS - Zeus Energy Grids</option>
                            <option value="LUNA">LUNA - Lunar Mining Resources</option>
                            <option value="EDGE">EDGE - Edge Compute Infrastructure</option>
                            <option value="FUSE">FUSE - Fusion Nuclear Labs</option>
                            <option value="FLUX">FLUX - Flux Power Dynamics</option>
                            <option value="HELI">HELI - Helios Solar Tech</option>
                            <option value="ECHO">ECHO - Echo Media Streaming</option>
                            <option value="VIRT">VIRT - Virtualis Gaming Interactive</option>
                        </select>
                    </div>

                    <!-- 2. Headline Input -->
                    <div>
                        <label class="text-xs font-semibold text-gray-400 block mb-2">Market Headline</label>
                        <input type="text" id="news-headline-input" required placeholder="e.g., Tech Corp announces massive regulatory audit failure..." 
                               class="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accentBlue transition-colors">
                    </div>

                    <!-- 3. Impact Severity Control -->
                    <div>
                        <label class="text-xs font-semibold text-gray-400 block mb-2">Impact Severity & Volatility Multiplier</label>
                        <select id="sentiment-multiplier-select" class="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-accentBlue transition-colors font-mono">
                            <option value="1.35">🟢 Heavy Bullish Surge (+35% Multiplier Impact)</option>
                            <option value="1.15">🟢 Moderate Bullish Growth (+15% Multiplier Impact)</option>
                            <option value="1.00" selected>⚪ Neutral / Standard Noise (1.0x Baseline)</option>
                            <option value="0.85">🔴 Moderate Bearish Dip (-15% Multiplier Impact)</option>
                            <option value="0.65">🔴 Heavy Bearish Crash (-35% Multiplier Impact)</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="dispatch-submit-btn" 
                            class="w-full py-4 rounded-xl font-bold text-xs bg-gradient-to-r from-rose-500 via-amber-500 to-rose-600 text-white shadow-xl shadow-rose-500/20 hover:opacity-95 transition-all mt-4">
                        🚀 Dispatch Event & Broadcast Volatility
                    </button>
                </form>
            </div>
        </section>

        <!-- RIGHT COLUMN: ACTIVE NEWS IMPACT LOGS (5 COLS) -->
        <section class="lg:col-span-5 bg-darkCard border border-darkBorder rounded-3xl p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between pb-4 border-b border-darkBorder mb-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <span>Active Event Logs</span>
                </h3>
                <button onclick="fetchActiveNewsLogs()" class="text-xs text-accentBlue hover:underline">Refresh</button>
            </div>

            <div id="news-logs-container" class="flex-1 overflow-y-auto space-y-3 max-h-[500px]">
                <div class="p-4 rounded-2xl bg-darkBg border border-darkBorder text-center text-xs text-gray-500">
                    No active news events dispatched yet.
                </div>
            </div>
        </section>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script>
        const API_BASE = window.location.origin || "http://localhost:8000";
        const broadcastChannel = new BroadcastChannel("apex_market_news");

        async function dispatchNewsEvent(event) {
            event.preventDefault();
            const submitBtn = document.getElementById("dispatch-submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Dispatching Volatility Payload...";

            const targetStock = document.getElementById("target-stock-select").value;
            const headline = document.getElementById("news-headline-input").value.trim();
            const sentiment = parseFloat(document.getElementById("sentiment-multiplier-select").value);

            const newsPacket = {
                type: "news",
                event: "news_flash",
                stock_ticker: targetStock === "GLOBAL" ? "GLOBAL" : targetStock,
                target: targetStock,
                headline: headline,
                sentiment_multiplier: sentiment,
                created_at: new Date().toISOString()
            };

            // 1. Cross-Tab Live Broadcast via BroadcastChannel & LocalStorage Sync
            try {
                broadcastChannel.postMessage(newsPacket);
            } catch (e) {}

            const existingLogs = JSON.parse(localStorage.getItem("apex_news_archive") || "[]");
            existingLogs.unshift(newsPacket);
            localStorage.setItem("apex_news_archive", JSON.stringify(existingLogs));
            localStorage.setItem("apex_last_news_event", JSON.stringify(newsPacket));

            // 2. Also Post to Backend API if running
            try {
                await fetch(`${API_BASE}/api/admin/news`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        stock_ticker: targetStock === "GLOBAL" ? null : targetStock,
                        headline: headline,
                        content: headline,
                        sentiment_multiplier: sentiment,
                        duration_minutes: 15
                    })
                });
            } catch (err) {}

            showToast(`Event Dispatched: [${newsPacket.stock_ticker}] ${headline}`, "success");
            document.getElementById("news-headline-input").value = "";
            renderLocalLogs();

            submitBtn.disabled = false;
            submitBtn.innerText = "🚀 Dispatch Event & Broadcast Volatility";
        }

        function renderLocalLogs() {
            const container = document.getElementById("news-logs-container");
            if (!container) return;

            const logs = JSON.parse(localStorage.getItem("apex_news_archive") || "[]");
            if (logs.length === 0) {
                container.innerHTML = `<div class="p-4 rounded-2xl bg-darkBg border border-darkBorder text-center text-xs text-gray-500">No active news events dispatched yet.</div>`;
                return;
            }

            let html = "";
            logs.forEach(log => {
                const isBull = log.sentiment_multiplier > 1.0;
                const isBear = log.sentiment_multiplier < 1.0;
                const badgeColor = isBull ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" : isBear ? "bg-rose-500/10 text-rose-400 border-rose-500/20" : "bg-gray-500/10 text-gray-400 border-gray-500/20";
                const ticker = log.stock_ticker || log.target || "GLOBAL";
                
                html += `
                    <div class="p-4 rounded-2xl bg-darkBg border border-darkBorder space-y-2">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold font-mono text-white">${ticker}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">
                                ${log.sentiment_multiplier}x Multiplier
                            </span>
                        </div>
                        <p class="text-xs text-gray-300 font-medium">${log.headline}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function fetchActiveNewsLogs() {
            renderLocalLogs();
        }

        function showToast(msg, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const bgClass = type === "success" ? "bg-emerald-500 text-white" : "bg-rose-500 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        window.addEventListener("DOMContentLoaded", renderLocalLogs);
    </script>
</body>
</html>
